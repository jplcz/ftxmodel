name: Generate and Deploy Doxygen Documentation

on:
  push:
    branches: [ master ] # Change to main if your default branch is named main
  workflow_dispatch:     # Allows manually triggering the build from the Actions tab

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs in-progress for safety
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Compile Doxygen Documentation Target
        run: doxygen

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v6

      # =========================================================================
      # Upload the compiled HTML directory from the CMake build tree
      # =========================================================================
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'output/html'

      # =========================================================================
      # Deploy the uploaded artifact straight to the GitHub Pages cloud
      # =========================================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
