name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: DevContainer Matrix Testing (${{ matrix.compiler }})
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/devcontainers/base:resolute

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            cc: gcc
          - compiler: clang++
            cc: clang

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # We must quickly ensure cmake and ninja are available in the base image
      # if they aren't pre-baked into the baseline Microsoft image layer
      # (This executes in less than 2 seconds when packages are minor)
      - name: Ensure Build Tooling is Present
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential clang

      - name: Configure CMake Build Target Tree
        env:
          CXX: ${{ matrix.compiler }}
          CC: ${{ matrix.cc }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFTXMODEL_ENABLE_INSTALL=ON

      - name: Compile Target Artifacts
        run: cmake --build build --parallel $(nproc)

      - name: Execute Framework Test Suite
        working-directory: build/tests
        run: ctest --output-on-failure --parallel $(nproc)