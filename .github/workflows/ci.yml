name: Continuous Integration for FTXModel

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # Allows manual pipeline triggering from the UI

jobs:
  build-and-test:
    name: GCC/Clang Matrix Testing (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # Don't cancel other matrix jobs if one compiler fails
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
            cc: gcc
          - os: ubuntu-latest
            compiler: clang++
            cc: clang

    steps:
      # Pull down repository source code layer
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # Create an isolated cache space for each operating system/compiler pair
          key: ${{ matrix.os }}-${{ matrix.compiler }}
          max-size: 500M

      - name: Configure CMake Build Target Tree
        env:
          CXX: ${{ matrix.compiler }}
          CC: ${{ matrix.cc }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFTXMODEL_ENABLE_INSTALL=ON \
            -DFTXMODEL_ENABLE_TESTING=ON \
            -DFTXMODEL_ENABLE_APPS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Compile the source library tree and test harness executable
      - name: Compile Target Artifacts
        run: cmake --build build

      # Execute the GoogleTest suite via CTest test framework runner
      - name: Execute Framework Test Suite
        working-directory: build
        run: |
          ctest --output-on-failure \
                --schedule-random \
                --parallel $(nproc)
