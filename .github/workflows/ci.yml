name: Continuous Integration for FTXModel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual pipeline triggering from the UI

jobs:
  build-and-test:
    name: GCC/Clang Matrix Testing (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    container:
      image: gitea.kimbap.pl/docker-images/ftxmodel-ci:latest

    strategy:
      fail-fast: false # Don't cancel other matrix jobs if one compiler fails
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
            cc: gcc
          - os: ubuntu-latest
            compiler: clang++
            cc: clang

    steps:
      # Pull down repository source code layer
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v3
        with:
          go-version: '1.20'

      - name: Generate Dependency Tree Hash
        id: cpm-hash
        uses: https://gitea.com/actions/go-hashfiles@v0.0.1
        with:
          patterns: |-
            **/CMakeLists.txt
            **/*.cmake

      - name: Synchronize CPM Packages Cache
        uses: https://github.com/actions/cache@v5
        with:
          path: ~/.cache/cpm
          # Use the generated checksum out of step 1 to uniquely stamp the cache block
          key: ${{ runner.os }}-cpm-${{ steps.cpm-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Configure CMake Build Target Tree
        env:
          CXX: ${{ matrix.compiler }}
          CC: ${{ matrix.cc }}
          CPM_SOURCE_CACHE: ${{ github.workspace }}/../.cache/cpm
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFTXMODEL_ENABLE_INSTALL=ON \
            -DFTXMODEL_ENABLE_TESTING=ON \
            -DFTXMODEL_ENABLE_APPS=ON \
            -DCPM_SOURCE_CACHE=$CPM_SOURCE_CACHE

      # Compile the source library tree and test harness executable
      - name: Compile Target Artifacts
        run: cmake --build build --parallel $(nproc)

      # Execute the GoogleTest suite via CTest test framework runner
      - name: Execute Framework Test Suite
        working-directory: build/tests
        run: |
          ctest --output-on-failure \
                --schedule-random \
                --parallel $(nproc)
